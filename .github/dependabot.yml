version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']
      test-tooling:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@testing-library/*', 'jsdom']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1; see docs/adr/0002-workspace-foundation.md.
      - dependency-name: typescript
        versions: ['>= 6.1.0']
      # @types/node tracks the pinned Node.js 24 runtime line.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
