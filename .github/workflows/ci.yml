name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual-baselines:
        description: >-
          Make the visual baselines on this ref with CI's Chromium and upload them with their
          manifest, instead of running the end-to-end tests (docs/architecture/engine/quality.md)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with `.nvmrc` and `packageManager` in package.json.
  NPM_VERSION: 11.19.1

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run guardrails
      - run: npm run secrets:scan
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle-size guardrail
        run: npm run check:bundle-size
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx --workspace @planewright/web playwright install --with-deps chromium
      - name: Runner image and processor
        run: |
          echo "Runner image: $ImageOS $ImageVersion"
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):'
      - run: npm run build
      - run: npm run test:e2e
        if: ${{ !inputs.visual-baselines }}
      # The visual baselines are made only here, on a dispatched run of a candidate branch, and
      # never committed by CI: the artifact holds the 30 images and a manifest of the run, the
      # runner, the versions and each file's SHA-256 and size, for a commit that adopts them.
      - name: Make the visual baselines
        if: ${{ inputs.visual-baselines }}
        working-directory: apps/web
        run: npx --no -- playwright test --update-snapshots=all --retries=0 visual-
      - name: Write the visual baselines' manifest
        if: ${{ inputs.visual-baselines }}
        working-directory: apps/web
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "runner image: $ImageOS $ImageVersion"
            echo "processor: $(lscpu | sed -n 's/^Model name: *//p')"
            echo "playwright: $(npx --no -- playwright --version)"
            echo "chromium: $(node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch(); console.log(browser.version()); await browser.close();")"
            echo "files:"
            cd tests/e2e
            for image in *-snapshots/*.png; do
              echo "$(sha256sum "$image" | cut -d ' ' -f 1) $(stat -c %s "$image") $image"
            done
          } | tee visual-baselines-manifest.txt
      - name: Upload the visual baselines
        if: ${{ inputs.visual-baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: |
            apps/web/visual-baselines-manifest.txt
            apps/web/tests/e2e/*-snapshots/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
      # A failed screenshot comparison leaves its expected, actual and diff images here, named by
      # the baseline; the HTML report keeps them only under content hashes.
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 14

  performance:
    # The performance budgets (docs/architecture/engine/quality.md#what-issue-38-decided): every
    # value is reported in the job summary and kept as an artifact; statistical budgets fail only
    # once docs/performance/baseline.json holds three runs on main on the runner's processor model.
    name: Performance report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx --workspace @planewright/web playwright install --with-deps chromium
      - run: npm run build
      - name: Bundle sizes
        run: npm run check:bundle-size
      - name: Engine and web benchmarks
        if: ${{ !cancelled() }}
        run: npm run perf:bench
      - name: Browser measurements
        if: ${{ !cancelled() }}
        run: npm run perf:browser
      - name: Performance report
        if: ${{ !cancelled() }}
        run: npm run perf:report
      - name: Upload performance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: perf-results/
          retention-days: 90
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:deps
      - run: npm run check:deps-policy

  secret-history:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  conventions:
    name: Branch and commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-branch-name.ts "$HEAD_REF"
      - name: Lint pull request title (used as the squash-merge commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
      - name: Lint commit messages
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
